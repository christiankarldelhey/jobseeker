name: JobWatch poll

permissions:
  contents: write

on:
  schedule:
    # Hourly, active 07:00-23:00 local (Europe/Madrid, UTC+2 in summer/CEST).
    # GitHub Actions cron runs in UTC and doesn't shift with DST -- in winter
    # (CET, UTC+1) this window drifts to 06:00-22:00 local. Adjust the "5-21"
    # range by +/-1 manually around DST changes (late Mar / late Oct) if the
    # 1h drift bothers you.
    - cron: "0 5-21 * * *"
    - cron: "0 5 * * *"      # daily digest trigger reference (see digest job below) -- fires alongside the first poll of the day
  workflow_dispatch: {}

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run poller
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
          NOTIFY_EMAIL_FROM: ${{ secrets.NOTIFY_EMAIL_FROM }}
        run: python -m jobwatch.run

      - name: Commit updated DB
        run: |
          git config user.name "jobwatch-bot"
          git config user.email "jobwatch-bot@users.noreply.github.com"
          git add jobwatch.db
          git diff --staged --quiet || git commit -m "chore: update jobwatch.db [skip ci]"
          git push

  digest:
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 5 * * *'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send daily digest
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
          NOTIFY_EMAIL_FROM: ${{ secrets.NOTIFY_EMAIL_FROM }}
        run: python -m jobwatch.digest

      - name: Commit updated DB
        run: |
          git config user.name "jobwatch-bot"
          git config user.email "jobwatch-bot@users.noreply.github.com"
          git add jobwatch.db
          git diff --staged --quiet || git commit -m "chore: update jobwatch.db after digest [skip ci]"
          git push
