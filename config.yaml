# Perfil de búsqueda. Editá este archivo para cambiar stack/seniority/geo
# sin tocar código Python. match.py lee esto en cada corrida.

# Si el título/ubicación/descripción contiene cualquiera de estas palabras,
# la oferta se descarta directamente sin importar el score.
hard_exclude:
  - intern
  - internship
  - becari
  - becario
  - becaria
  - prácticas
  - junior
  - trainee
  - graduate programme
  - graduate program
  - wordpress
  - .net
  - java developer
  - devops engineer
  - data engineer

# Palabras clave de stack técnico y su peso en el score. Basado en el CV:
# Senior Front-End (Vue 3/TS) con React/RN intermedio, Node.js backend,
# testing (Vitest/Playwright/Jest) y experiencia geoespacial/AI-augmented dev.
stack:
  vue: 5
  vue.js: 5
  nuxt: 4
  composition api: 4
  pinia: 3
  typescript: 4
  frontend: 3
  front-end: 3
  front end: 3
  javascript: 1
  react: 2
  react native: 2
  node: 2
  node.js: 2
  design system: 2
  feature-sliced: 2
  vitest: 1
  playwright: 1
  geospatial: 2
  postgis: 1
  websocket: 1
  generative ai: 1
  agentic: 1
  laravel: 1
  php: 1

# Palabras clave de seniority y su peso.
seniority:
  senior: 4
  lead: 2
  staff: 2
  principal: 2
  mid-level: 1

# Palabras clave de geografía y su peso. Abierto a mudanza dentro de la UE,
