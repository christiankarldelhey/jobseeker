  ireland: 2
  france: 1
  italy: 1
  poland: 1
  amsterdam: 2
  berlin: 2
  lisbon: 2
  dublin: 2

# Control de antigüedad. Ofertas sin fecha conocida (algunos ATS no la
# exponen) nunca se filtran por estas reglas, ya que no se puede verificar
# su antigüedad -- se muestran igual, marcadas como "fecha desconocida".
#
# - stale_after_days: entre este valor y max_age_days, una oferta que
#   calificaría como "immediate" se degrada a "digest" (sigue llegando, pero
#   sin urgencia) -- rescata ofertas viejas que siguen abiertas sin
#   interrumpirte como si fueran nuevas.
# - max_age_days: más allá de esto, la oferta se descarta directamente
#   (probablemente cubierta o el ATS ya no la mantiene actualizada).
stale_after_days: 30
max_age_days: 45

# Umbrales de score para decidir cómo notificar.
thresholds:
  immediate: 8   # score >= este valor -> email inmediato
  digest: 5      # score >= este valor (pero < immediate) -> entra en el digest diario

# Cada cuántos minutos correr el poller (usado como referencia; el cron real
# se define en .github/workflows/poll.yml). Corre cada hora, activo de
# 07:00 a 23:00 hora local, en pausa de 00:00 a 07:00.
poll_interval_minutes: 60
